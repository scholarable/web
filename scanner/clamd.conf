LocalSocket /tmp/clamd.sock
Foreground yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogTime no
LogClean no
LogVerbose no
LogSyslog no
MaxThreads 1
MaxQueue 2
MaxScanTime 8000
StreamMaxLength 5M
MaxFileSize 5M
MaxScanSize 32M
MaxRecursion 16
AlertEncrypted yes
AlertExceedsMax yes
SelfCheck 60
